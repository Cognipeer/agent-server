name: Publish to npm

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      tag:
        description: "Existing vX.Y.Z tag to publish"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: npm-publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v')) ||
      (github.event_name == 'workflow_dispatch' && startsWith(inputs.tag, 'v'))
    # npm provenance is only accepted from GitHub-hosted runners.
    runs-on: ubuntu-latest
    # The storage tests run against real MongoDB and PostgreSQL (see test/storage/global-setup.ts).
    # REQUIRE_ALL_PROVIDERS makes a provider that cannot run a failure instead of a skip.
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MONGODB_URL: mongodb://localhost:27017
      PG_URL: postgres://postgres:postgres@localhost:5432/postgres
      REQUIRE_ALL_PROVIDERS: "1"
      # the service container is used, so mongodb-memory-server need not download a mongod
      MONGOMS_DISABLE_POSTINSTALL: "1"
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json version
        env:
          TAG_NAME: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          TAG_VERSION="${TAG_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PACKAGE_VERSION)"
            exit 1
          fi

      - name: Run tests (all storage providers)
        run: npm test

      - name: Build
        run: npm run build

      - name: Check package contents
        run: npm pack --dry-run --ignore-scripts

      - name: Publish
        run: npm publish --access public

      # CRM yalnız kayıt tutar; erişilemezse ya da reddederse yayın etkilenmez.
      - name: Report release to CRM
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        env:
          WEBHOOK_URL: ${{ secrets.RELEASE_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.RELEASE_WEBHOOK_SECRET }}
          PRODUCT: agent-server
          TARGET_KEY: default
          CRM_ENVIRONMENT: production
          RELEASE_VERSION: ${{ github.event.release.tag_name || inputs.tag }}
          RELEASE_STATUS: ${{ job.status == 'success' && 'succeeded' || 'failed' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: COMMIT_SHA="$(git rev-parse HEAD)" bash ci/notify-release-crm.sh
