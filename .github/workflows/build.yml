name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # The storage tests run against real MongoDB and PostgreSQL (see test/storage/global-setup.ts).
    # REQUIRE_ALL_PROVIDERS makes a provider that cannot run a failure instead of a skip.
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MONGODB_URL: mongodb://localhost:27017
      PG_URL: postgres://postgres:postgres@localhost:5432/postgres
      REQUIRE_ALL_PROVIDERS: "1"
      # the service container is used, so mongodb-memory-server need not download a mongod
      MONGOMS_DISABLE_POSTINSTALL: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests (all storage providers)
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build package
        run: npm run build

      - name: Build docs
        run: npm run docs:build

      - name: Check package contents
        run: npm pack --dry-run --ignore-scripts